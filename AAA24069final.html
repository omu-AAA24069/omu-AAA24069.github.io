
<!DOCTYPE html>
<html>
    <head>
        <title>1.地図タイルを背景として表示する</title>
        <!-- LeafletのCSS読み込み -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
            integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
            crossorigin=""
        />
        <!-- LeafletのJavaScript読み込み -->
        <script
            src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
            integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
            crossorigin=""
        ></script>

         <!-- Leaflet.markerclusterを読み込み -->
         <script src="https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js"></script>
        <link
           rel="stylesheet"
         href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css"
        />
        <link
           rel="stylesheet"
            href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css"
        />

        <!-- 雨雲レイヤーのJavaScript/CSS読み込み -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.css"/>
<script src="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.js"></script>
   
        <script>
            const shelterIcon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-icon-2x-red.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });


            const redPinIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',

                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            const elevationLayer = L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png',
  {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.gsi.go.jp/">国土地理院</a>'
  }
  
);


        </script>

        <style>
            .shelter-cluster {
                background-color: rgba(255, 0, 0, 0.6);
            }
            .shelter-cluster div {
            background-color: rgba(255, 0, 0, 0.8);
        }
        </style>


    </head>
    <body>
        <!-- 地図を表示するdiv要素を宣言 -->
        <div id="map" style="height: 80vh"></div>
        <script>
            // 地図インスタンスを初期化
            const map = L.map('map', {
                center: [34.544648, 135.506436], // 初期表示の地図中心の[緯度, 経度]
                zoom: 16, // 初期ズームレベル
            });
            // 背景レイヤーインスタンスを初期化
            const backgroundLayer = L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png', // OSMのURLテンプレート
                {
                    maxZoom: 19,
                    attribution:
                        '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                },
            );
            // 地図インスタンスへレイヤーを追加
            map.addLayer(backgroundLayer);


            // 背景レイヤーインスタンスを初期化
            const chiriinLayer = L.tileLayer(
         'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',  // 地理院地図のURLテンプレート
         {
          maxZoom: 18
          },
            );
           // 地理院地図インスタンスへレイヤーを追加
        map.addLayer(chiriinLayer);

        var LayerControl = L.control.layers({
        "地理院地図（標準）": chiriinLayer,
        "OpenStreetMap": backgroundLayer
    }).addTo(map);
    
// 大阪（堺市）だけに標高レイヤーを表示
const osakaBounds = [
    [34.45, 135.45], // 南西（緯度, 経度）
    [34.65, 135.60]  // 北東
];

const elevationLayerOsaka = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.gsi.go.jp/">国土地理院</a>',
    bounds: osakaBounds,
    noWrap: true,
    opacity: 0.4
});

// チェックボックスに追加
LayerControl.addOverlay(elevationLayerOsaka, "標高");

   


        // ピン定義
        const nakamozu_marker = L.marker([34.544865,135.506274]); // ピン＝Markerを初期化
        nakamozu_marker.bindPopup('なかもずキャンパスC棟'); // ポップアップを紐付け
        map.addLayer(nakamozu_marker); // ピンを地図上に追加

        // 下のようにも書ける
        L.marker([34.592331,135.505276]).bindPopup('杉本キャンパス').addTo(map);
           

        map.attributionControl.addAttribution(
  '<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P29-v2_0.html">国土数値情報 - 学校データ</a>',
);




    map.attributionControl.addAttribution(
  '<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P29-v2_0.html">国土数値情報 - 学校データ</a>',
);
 // GeoJSONレイヤーを作成
fetch('./P29-21_27.geojson') // 大阪府の学校データ
.then(res => res.json())
.then(json => {
    // クラスタリング用レイヤー作成
    const schoolMarkers = L.markerClusterGroup({
        // 必要ならオプション指定
        // disableClusteringAtZoom: 17
    });

    // GeoJSONをクラスタリングレイヤーに追加
    L.geoJSON(json, {
        pointToLayer: (feature, latlng) => {
            return L.marker(latlng); // デフォルトのピン
        },
        onEachFeature: (feature, layer) => {
            layer.bindPopup(feature.properties.P29_004);
        }
    }).addTo(schoolMarkers);

    // 地図に追加
    schoolMarkers.addTo(map);

    // チェックボックスに追加
    LayerControl.addOverlay(schoolMarkers, "学校");
});


// ラインレイヤーを作成
            fetch("./line.geojson") // ルートデータの非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                var line = L.geoJSON(data, {
                    "color": "#FF00FF",
                    "weight": 6,
                    "opacity": 0.65
                })
                    map.addLayer(line)
                    LayerControl.addOverlay(line, "ルート")
            });

                        // 行政区域レイヤーを作成
            fetch("./N03-23_27_230101.geojson") // 行政区域データを非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                    // 特定の値によりGeoJSONをフィルタリング
                    var filteredData = data.features.filter(feature => feature.properties.N03_004 === '堺市東区');
                    var selected_area = L.geoJSON(filteredData)
                        .bindPopup((layer) => layer.feature.properties.N03_004) // ポップアップで表示
                    map.addLayer(selected_area)
                    // チェックボックス
                    LayerControl.addOverlay(selected_area, "行政区域")
                    // GeoJSONレイヤに地図がフィットするように表示範囲を自動調整
                    map.fitBounds(selected_area.getBounds());
            });

                // ローカルPC上のOSRMサーバで杉本キャンパスからなかもずキャンパスまでのルートを検索するURL
    const url = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/135.505276,34.592331;135.506274,34.544865?geometries=geojson&overview=full'

const url1 = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/135.505276,34.592331;135.506274,34.544865?geometries=geojson&overview=full';
const url2 = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/135.506274,34.544865;135.37015,34.35363?geometries=geojson&overview=full';


const routeGroup1 = L.layerGroup();
const routeGroup2 = L.layerGroup();
async function addRoutes(){
  // なかもず→杉本
  const res1 = await fetch(url1);
  const json1 = await res1.json();
  L.geoJSON(json1.routes[0].geometry, { color: "#FF00FF", weight: 6, opacity: 0.65 }).addTo(routeGroup1);

  // なかもず→大木小
  const res2 = await fetch(url2);
  const json2 = await res2.json();
  L.geoJSON(json2.routes[0].geometry, { color: "#0000FF", weight: 5, opacity: 0.7 }).addTo(routeGroup2);

  // 地図に追加
  routeGroup1.addTo(map);
  routeGroup2.addTo(map);

  // チェックボックスに追加
  LayerControl.addOverlay(routeGroup1, "なかもず→杉本");
  LayerControl.addOverlay(routeGroup2, "なかもず→大木小学校");

  // 地図を全体表示
  const bounds = L.latLngBounds([
      ...routeGroup1.getBounds().getSouthWest(), ...routeGroup1.getBounds().getNorthEast(),
      ...routeGroup2.getBounds().getSouthWest(), ...routeGroup2.getBounds().getNorthEast()
  ]);
  map.fitBounds(bounds);
}

addRoutes();



fetch('27140_2.geojson')
.then(res => res.json())
.then(json => {

    // 指定避難所クラスタ
const shelterMarkers = L.markerClusterGroup({
    disableClusteringAtZoom: 17,
    removeOutsideVisibleBounds: false,

    iconCreateFunction: function (cluster) {
        return L.divIcon({
            html: '<div><span>' + cluster.getChildCount() + '</span></div>',
            className: 'marker-cluster marker-cluster-small shelter-cluster',
            iconSize: L.point(40, 40)
        });
    }
});


    // 避難所マーカー
L.geoJSON(json, {
    pointToLayer: (feature, latlng) => {
        return L.marker(latlng, { icon: redPinIcon });
    },
    onEachFeature: (feature, layer) => {
        layer.bindPopup(
            '<b>指定緊急避難所</b><br>' +
            (feature.properties.P29_004 || '')
        );
    }
}).addTo(shelterMarkers);


    shelterMarkers.addTo(map);
    LayerControl.addOverlay(shelterMarkers, "指定緊急避難所");

});

// 雨雲レイヤーを追加
L.control.rainviewer({ 
	position: 'bottomleft',
	nextButtonText: '>',
	playStopButtonText: 'Play/Stop',
	prevButtonText: '<',
	positionSliderLabelText: "Hour:",
	opacitySliderLabelText: "Opacity:",
	animationInterval: 500,
	opacity: 0.5
}).addTo(map);


  
        //スケールバー
            L.control.scale().addTo(map);
        </script>
    </body>
</html>
